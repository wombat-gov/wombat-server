[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wombat-server"
version = "1.2.0"
description = "WOMBATpass – API server for persisting and querying scan results"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Artem Lajko" },
    { name = "Sascha Lewandowski" },
    { name = "Sebastian Meyer" },
    { name = "Tim Urlaub" },
]
keywords = [
    "wombat", "iac", "compliance", "security", "cloud", "api",
    "devsecops", "governance", "fastapi", "multi-cloud",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "wombat-core>=1.2.0",
    "bcrypt>=4.0",
    "PyJWT>=2.8",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "cryptography>=42.0",
]

[project.urls]
Homepage = "https://www.wombat-gov.dev"
Documentation = "https://www.wombat-gov.dev/docs/"
Repository = "https://github.com/wombat-gov/wombat-server"
"Bug Tracker" = "https://github.com/wombat-gov/wombat-server/issues"
Community = "https://github.com/wombat-gov"

[project.scripts]
wombat-server = "wombat_server.main:start"
# Deprecated alias kept for the WAFpass → WOMBATpass migration window.
wafpass-server = "wombat_server.main:legacy_start"

[project.optional-dependencies]
saml = ["python3-saml>=1.16"]
qr = ["segno>=1.6"]
secrets-aws = ["boto3>=1.34"]
secrets-vault = ["hvac>=2.1"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.26",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
# Deprecated compatibility package; canonical import package is "wombat_server".
packages = ["wombat_server", "wafpass_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
asyncio_mode = "auto"
# Explicit default: pytest-asyncio warns (and will change the default) when
# this is unset. Fixtures are function-scoped throughout this suite anyway.
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
